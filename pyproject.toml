[project]
name = "metadata-compare-tool"
version = "0.1.0"
description = "Compare Salesforce metadata across branches, orgs, and installed packages"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
mct = "mct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mct"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "mct/scripts"

[project.optional-dependencies]
dev = ["mypy>=1.0", "pytest>=7.0"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
