[project]
name = "metadata-compare-tool"
version = "0.1.0"
description = "Compare Salesforce metadata across branches, orgs, and installed packages"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "billv5w" }]
keywords = ["salesforce", "metadata", "diff", "drift", "sfdx", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/billv5w/salesforce-metadata-compare"
Repository = "https://github.com/billv5w/salesforce-metadata-compare"
Issues = "https://github.com/billv5w/salesforce-metadata-compare/issues"
Changelog = "https://github.com/billv5w/salesforce-metadata-compare/blob/main/CHANGELOG.md"

[project.scripts]
mct = "mct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mct"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "mct/scripts"

[project.optional-dependencies]
dev = ["mypy>=1.0", "pytest>=7.0"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
